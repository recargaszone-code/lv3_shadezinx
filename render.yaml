services:
  - type: web
    name: quantum-public-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: ALLOW_ORIGIN
        value: "*"
      - key: REQUEST_TIMEOUT
        value: "60000"
      - key: SHARED_SECRET
        sync: false
